name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Grant execute permission
        run: chmod +x android-app/gradlew
        if: hashFiles('android-app/gradlew') != ''

      - name: Build APK
        run: |
          cd android-app
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: opencode-android.apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

  build-termux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Termux .deb
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg
          ./termux-deb/build.sh

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: opencode-termux.deb
          path: termux-deb/*.deb