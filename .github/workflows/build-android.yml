name: Build Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要 git 拉全量 tag, 用于推导最新版本号
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Gradle wrapper
        run: |
          mkdir -p android-app/gradle/wrapper
          curl -sL --max-time 30 \
            -o android-app/gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
          chmod +x android-app/gradlew

      - name: Build APK
        run: |
          cd android-app
          REF="${GITHUB_REF_NAME}"
          # 与 scripts/build-all.sh 同一算法: 同一 commit 本地/CI 得到同一版本号
          #   versionName = 最新 vX.Y.Z tag (非 tag commit 追加 -r<自 tag 起提交数>)
          #   versionCode = 2000000 + 仓库总提交数 (单调递增, 高于旧公式 1xxxxxx 区间)
          BASE=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n1)
          [ -n "$BASE" ] || BASE="0.7.0"
          if echo "$REF" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            VER="${REF#v}"                          # tag 构建: 干净的 X.Y.Z
          else
            CNT=$(git rev-list "v${BASE}"..HEAD --count)
            VER="$BASE-r$CNT"
          fi
          VCODE=$(( 2000000 + $(git rev-list --count HEAD) ))
          echo "Building $VER (code=$VCODE)"
          ./gradlew assembleDebug --no-daemon -PversionName="$VER" -PversionCode="$VCODE"

      - name: Rename APK
        run: |
          cd android-app
          cp app/build/outputs/apk/debug/app-debug.apk opencode-android.apk

      - name: Upload APK (Actions Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: opencode-android.apk
          path: android-app/opencode-android.apk
          if-no-files-found: error

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/opencode-android.apk
          name: OpenCode Android ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true