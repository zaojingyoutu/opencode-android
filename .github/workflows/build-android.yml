name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download opencode binary + musl libs
        run: |
          set -e

          # ============ 1. opencode 二进制 ============
          echo "=== Downloading opencode binary ==="
          curl -sL --max-time 120 \
            "https://github.com/anomalyco/opencode/releases/latest/download/opencode-linux-arm64-musl.tar.gz" \
            -o /tmp/opencode.tar.gz
          mkdir -p /tmp/assets/bin
          tar -xzf /tmp/opencode.tar.gz -C /tmp/assets/bin
          # 确认解压后文件存在
          find /tmp/assets/bin -name "opencode" -type f | head -1 | xargs -I{} cp {} /tmp/assets/bin/opencode.bin 2>/dev/null || true
          if [ ! -f /tmp/assets/bin/opencode.bin ]; then
            echo "ERROR: opencode binary not found after extraction"
            exit 1
          fi
          mv /tmp/assets/bin/opencode.bin /tmp/assets/bin/opencode
          chmod +x /tmp/assets/bin/opencode
          echo "Binary: $(ls -lh /tmp/assets/bin/opencode | awk '{print $5}')"

          # ============ 2. 用 apt 装 ARM64 musl 交叉工具链 ============
          echo "=== Installing ARM64 musl cross toolchain ==="
          sudo apt-get update -qq

          # 装 musl 的 aarch64 工具链（提供 libc.musl + libgcc_s）
          echo "=== Installing musl-tools (for libc.musl) ==="
          sudo apt-get install -y -qq musl-tools 2>&1 | tail -3

          # 从 musl.cc 下载 aarch64-musl 工具链（包含 libc + libgcc_s + libstdc++）
          echo "=== Downloading musl.cc aarch64 cross toolchain ==="
          curl -sL --max-time 300 \
            "https://musl.cc/aarch64-linux-musl-cross.tgz" \
            -o /tmp/musl-cross.tgz
          mkdir -p /tmp/musl-cross
          tar -xzf /tmp/musl-cross.tgz -C /tmp/musl-cross

          echo "=== Extracting musl libs ==="
          mkdir -p /tmp/assets/lib

          # libc.musl-aarch64.so.1
          find /tmp/musl-cross -name "libc.musl-aarch64.so*" | head -1 | \
            xargs -I{} cp {} /tmp/assets/lib/ 2>/dev/null || true
          find /tmp/musl-cross -name "libc.so" | head -1 | \
            xargs -I{} cp -P {} /tmp/assets/lib/ 2>/dev/null || true

          # libstdc++.so.6 (或 libstdc++.so.0)
          find /tmp/musl-cross -name "libstdc++.so*" | head -1 | \
            xargs -I{} cp {} /tmp/assets/lib/ 2>/dev/null || true

          # libgcc_s.so.1
          find /tmp/musl-cross -name "libgcc_s.so*" | head -1 | \
            xargs -I{} cp {} /tmp/assets/lib/ 2>/dev/null || true

          # libm 可能也需要
          find /tmp/musl-cross -name "libm.so*" | head -1 | \
            xargs -I{} cp -P {} /tmp/assets/lib/ 2>/dev/null || true

          echo "=== Libs extracted ==="
          ls -lh /tmp/assets/lib/ || echo "WARNING: no libs extracted!"

          # ============ 3. 拷贝到 APK assets ============
          echo "=== Copying to APK assets ==="
          mkdir -p android-app/app/src/main/assets/{bin,lib}
          cp /tmp/assets/bin/opencode android-app/app/src/main/assets/bin/
          cp /tmp/assets/lib/* android-app/app/src/main/assets/lib/ 2>/dev/null || true

          echo "=== Final assets ==="
          echo "bin:"; ls -lh android-app/app/src/main/assets/bin/
          echo "lib:"; ls -lh android-app/app/src/main/assets/lib/ 2>/dev/null || echo "(empty)"

      - name: Download Gradle wrapper
        run: |
          mkdir -p android-app/gradle/wrapper
          curl -sL --max-time 30 \
            -o android-app/gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
          chmod +x android-app/gradlew

      - name: Build APK
        run: |
          cd android-app
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: opencode-android.apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk