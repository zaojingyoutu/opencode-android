name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 从所有 releases 中选语义版本最大的 tag, patch +1; 无 release 时从 0.1.0 开始
      # tag 若已存在 (如上次发布失败) 则继续递增直到可用
      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          LATEST=$(curl -sL --max-time 30 \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" \
            | python3 -c "import sys,json; rels=json.load(sys.stdin); tags=[r['tag_name'] for r in rels if r['tag_name'].startswith('v')]; tags.sort(key=lambda t:[int(x) for x in t[1:].split('.')]); print(tags[-1] if tags else '')" 2>/dev/null || true)
          if [ -z "$LATEST" ]; then
            NEXT="0.1.0"
          else
            TAG="${LATEST#v}"
            IFS=. read -r MAJ MIN PAT <<< "$TAG"
            NEXT="$MAJ.$MIN.$((PAT+1))"
          fi
          while git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null 2>&1; do
            IFS=. read -r MAJ MIN PAT <<< "$NEXT"
            NEXT="$MAJ.$MIN.$((PAT+1))"
          done
          IFS=. read -r M m p <<< "$NEXT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "code=$((M*10000 + m*100 + p))" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT (versionCode: $((M*10000 + m*100 + p)))"

      - name: Download Gradle wrapper
        run: |
          mkdir -p android-app/gradle/wrapper
          curl -sL --max-time 30 \
            -o android-app/gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
          chmod +x android-app/gradlew

      - name: Build APK
        run: |
          cd android-app
          ./gradlew assembleDebug --no-daemon \
            -PversionName=${{ steps.ver.outputs.next }} \
            -PversionCode=${{ steps.ver.outputs.code }}

      - name: Upload APK (Actions Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: opencode-android.apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 自动打 tag (不会再次触发本 workflow, 因为只监听 main 分支 push)
      - name: Create and push tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ steps.ver.outputs.next }}
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            v${{ steps.ver.outputs.next }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.next }}
          name: OpenCode Android v${{ steps.ver.outputs.next }}
          generate_release_notes: true
          files: android-app/app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true