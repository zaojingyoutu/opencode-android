name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download opencode binary + musl libs
        run: |
          set -e

          # ============ 1. opencode 二进制 ============
          echo "=== Downloading opencode binary ==="
          curl -sL --max-time 180 \
            "https://github.com/anomalyco/opencode/releases/latest/download/opencode-linux-arm64-musl.tar.gz" \
            -o /tmp/opencode.tar.gz
          mkdir -p /tmp/assets/bin
          tar -xzf /tmp/opencode.tar.gz -C /tmp/assets/bin
          find /tmp/assets/bin -name "opencode" -type f | head -1 | xargs -I{} cp {} /tmp/assets/bin/opencode.bin
          chmod +x /tmp/assets/bin/opencode.bin
          echo "Binary: $(ls -lh /tmp/assets/bin/opencode.bin | awk '{print $5}')"

          # ============ 2. 从 musl.cc 用 wget 分块下载（比 curl 抗超时） ============
          echo "=== Downloading musl.cc aarch64 cross toolchain ==="
          mkdir -p /tmp/assets/lib
          for i in 1 2 3; do
            echo "Attempt $i..."
            wget --timeout=30 --tries=3 -O /tmp/musl-cross.tgz \
              "https://musl.cc/aarch64-linux-musl-cross.tgz" && break
            sleep 5
          done
          mkdir -p /tmp/musl-cross
          tar -xzf /tmp/musl-cross.tgz -C /tmp/musl-cross

          # 提取 musl 版本的 libc/libstdc++/libgcc_s
          echo "=== Extracting musl libs ==="
          find /tmp/musl-cross -name "libc.musl-aarch64.so*" | head -1 | \
            xargs -I{} cp {} /tmp/assets/lib/ 2>/dev/null || true
          find /tmp/musl-cross -name "libc.so" | head -1 | \
            xargs -I{} cp -P {} /tmp/assets/lib/ 2>/dev/null || true
          find /tmp/musl-cross -name "libstdc++.so*" | head -1 | \
            xargs -I{} cp {} /tmp/assets/lib/ 2>/dev/null || true
          find /tmp/musl-cross -name "libgcc_s.so*" | head -1 | \
            xargs -I{} cp {} /tmp/assets/lib/ 2>/dev/null || true
          find /tmp/musl-cross -name "libm.so*" | head -1 | \
            xargs -I{} cp -P {} /tmp/assets/lib/ 2>/dev/null || true
          find /tmp/musl-cross -name "ld-musl-aarch64.so*" | head -1 | \
            xargs -I{} cp {} /tmp/assets/lib/ 2>/dev/null || true

          echo "=== Final libs ==="
          ls -lh /tmp/assets/lib/ 2>/dev/null || echo "(empty)"

          # ============ 3. 拷贝到 APK assets ============
          echo "=== Copying to APK assets ==="
          mkdir -p android-app/app/src/main/assets/{bin,lib}
          cp /tmp/assets/bin/opencode.bin android-app/app/src/main/assets/bin/
          if [ -d /tmp/assets/lib ] && [ "$(ls -A /tmp/assets/lib 2>/dev/null)" ]; then
            cp /tmp/assets/lib/* android-app/app/src/main/assets/lib/
          fi

          echo "=== Final assets ==="
          echo "bin:"; ls -lh android-app/app/src/main/assets/bin/
          echo "lib:"; ls -lh android-app/app/src/main/assets/lib/ 2>/dev/null || echo "(empty)"

      - name: Download Gradle wrapper
        run: |
          mkdir -p android-app/gradle/wrapper
          curl -sL --max-time 30 \
            -o android-app/gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
          chmod +x android-app/gradlew

      - name: Build APK
        run: |
          cd android-app
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: opencode-android.apk
          path: android-app/app/build/outputs/apk/debug/*.apk