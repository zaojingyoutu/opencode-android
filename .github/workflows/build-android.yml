name: Build Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要 git 拉全量 tag, 用于推导最新版本号
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        run: |
          # ubuntu runner 自带 SDK, 不再用 android-actions/setup-android@v3:
          # 它会让 sdkmanager 装早已下架的 tools 包, 新版 cmdline-tools 直接 exit 1
          # (#88/#89 连挂两次都是死在这一步, 与代码无关)
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          # GITHUB_PATH 只对后续步骤生效, 本步骤内需 export 才能直接调 sdkmanager
          CT=""
          for d in "$SDK"/cmdline-tools/latest "$SDK"/cmdline-tools/*; do
            [ -x "$d/bin/sdkmanager" ] && { CT="$d/bin"; break; }
          done
          [ -n "$CT" ] || { echo "no cmdline-tools found"; ls "$SDK/cmdline-tools"; exit 1; }
          echo "$CT" >> $GITHUB_PATH
          echo "$SDK/platform-tools" >> $GITHUB_PATH
          export PATH="$CT:$PATH"
          yes | sdkmanager --licenses > /dev/null
          # compileSdk 34 (build.gradle.kts), runner 一般预装, 没有则现场装 (幂等)
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Download Gradle wrapper
        run: |
          mkdir -p android-app/gradle/wrapper
          curl -sL --max-time 30 \
            -o android-app/gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
          chmod +x android-app/gradlew

      - name: Run unit tests
        run: |
          cd android-app
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build APK
        run: |
          cd android-app
          # 与 scripts/build-all.sh 同一算法: 同一 commit 本地/CI 得到同一版本号
          #   versionName = tag 构建时用 tag 名本身 (保证 tag==versionName);
          #                 main 构建时 = 最近 vX.Y.Z tag, 非 tag commit 追加 -r<提交数>
          #   versionCode = 2000000 + 仓库总提交数 (单调递增, 高于旧公式 1xxxxxx 区间)
          # 只认严格 SemVer 的 vX.Y.Z 作版本基座 (4 段如 v0.9.4.1 不参与版本派生)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            # 只认严格 SemVer 的 vX.Y.Z; 取 HEAD 可达且距离最近的一个作版本基座
            BASE=""
            BEST=999999
            for t in $(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'); do
              if git merge-base --is-ancestor "$t" HEAD 2>/dev/null; then
                C=$(git rev-list "$t"..HEAD --count)
                if [ "$C" -lt "$BEST" ]; then BEST="$C"; BASE="${t#v}"; fi
              fi
            done
            [ -n "$BASE" ] || BASE="0.7.0"
            CNT=$(git rev-list "v${BASE}"..HEAD --count 2>/dev/null || echo 0)
            VER="$BASE-r$CNT"
          fi
          VCODE=$(( 2000000 + $(git rev-list --count HEAD) ))
          echo "Building $VER (code=$VCODE)"
          ./gradlew assembleDebug --no-daemon -PversionName="$VER" -PversionCode="$VCODE"

      - name: Rename APK
        run: |
          cd android-app
          cp app/build/outputs/apk/debug/app-debug.apk opencode-android.apk

      - name: Upload APK (Actions Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: opencode-android.apk
          path: android-app/opencode-android.apk
          if-no-files-found: error

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/opencode-android.apk
          name: OpenCode Android ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true